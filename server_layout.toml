# Aufbau des Servers. provision.py legt daraus Rollen, Kanäle, Rechte und Menüs an.
# Es löscht nie etwas und ändert nur die hier genannten Dinge.

guild_id = 0                # 0 = der einzige Server des Bots. Nur nötig, wenn er auf mehreren ist.
kontakt = "fachschaft.it@hs-esslingen.de"
timezone = "Europe/Berlin"
afk_timeout_seconds = 900   # Erlaubt: 60, 300, 900, 1800, 3600
events_color = "#EB459E"    # pink, für alle Event-Rollen

[roles]
member = "IT"
international = "International Student"
admin = "admin"             # Muss exakt dem Namen der bestehenden Rolle entsprechen
fachschaft = "Aktives Fachschaftsmitglied"
fsv = "Fachschaftsvertreter"

[channels]
honeypot = "exmatrikulation"
rules = "regeln"
rules_category = "Informationen"
welcome = "willkommen"                # neu, hier landen die Join-Nachrichten von Discord
menu_category = "Studienwahl"
studiengangwahl = "studiengangwahl"   # neu
semesterwahl = "semesterwahl"
wahlfaecher = "fächerwahl-wahlfächer"
eventwahl = "eventwahl"               # neu
voice_category = "Voice Channels"
hub = "➕ Raum erstellen"              # neu
afk = "AFK"                           # neu

# ---------------------------------------------------------------------------
# Texte
# ---------------------------------------------------------------------------
[texts]
rules_title = "Willkommen / Welcome"
rules_button = "Regeln akzeptieren / Accept rules"
rules = """
**Willkommen auf dem Discord der Fachschaft IT!**
Dieser Server ist kein offizieller Kommunikationskanal der Fakultät. Er wird von Mitgliedern der Fachschaft IT bereitgestellt und administriert, damit wir besseren Kontakt zu euch Studierenden haben.

**Regeln**
1. Geht respektvoll miteinander um. Beleidigungen, Hetze und Diskriminierung sind verboten.
2. Keine Werbung, kein Spam, keine rechtswidrigen Inhalte.
3. Teilt keine privaten Daten anderer und keine urheberrechtlich geschützten Materialien.
4. Für Klausuren und Prüfungsleistungen gelten die Regeln der Hochschule. Täuschungsversuche haben hier keinen Platz.
5. Schreibt im passenden Kanal und folgt den Anweisungen der Admins.
6. Verstöße können zu Verwarnung, Kick oder Bann führen.

Probleme oder versehentlich gebannt? Schreibt an {kontakt}.

Mit dem Button unten akzeptierst du die Regeln und schaltest den Server frei.

**Welcome to the Discord server of the Fachschaft IT!**
This server is not an official communication channel of the faculty. It is provided and administered by members of the Fachschaft IT so we can stay in closer contact with students.

**Rules**
1. Treat each other with respect. Insults, hate speech and discrimination are forbidden.
2. No advertising, no spam, no illegal content.
3. Do not share other people's private data or copyrighted material.
4. University rules apply to exams and graded work. Cheating has no place here.
5. Post in the matching channel and follow the admins' instructions.
6. Violations can lead to a warning, kick or ban.

Having problems or banned by mistake? Write to {kontakt}.

Use the button below to accept the rules and unlock the server.
"""
honeypot_warning = """
⚠️ **Nicht in diesen Kanal schreiben!** Jede Nachricht hier führt zum sofortigen, automatischen Bann. Der Kanal ist eine Falle für Spam-Bots.
Versehentlich gebannt? Schreib an {kontakt}.

⚠️ **Do not post in this channel!** Any message here leads to an immediate, automatic ban. This channel is a trap for spam bots.
Banned by mistake? Write to {kontakt}.
"""
honeypot_topic = "⚠️ Nicht schreiben: sofortiger Bann. / Do not post: instant ban."

# ---------------------------------------------------------------------------
# Studiengänge: jede Kombination wird eine Rolle, z. B. "SWB SPO3".
# Sie schaltet den jeweiligen fächerwahl-Kanal frei und bekommt die Farbe des Studiengangs.
# Quelle: Sammlung Modulhandbücher (Stand 27.02.2026). Nur SPOs, unter denen in den
# letzten 8 Semestern (ab WiSe 2022/23) begonnen wurde.
# ---------------------------------------------------------------------------
[[studiengaenge]]
key = "AIM"
color = "#E67E22"   # orange
channel = "fächerwahl-aim"
spos = ["SPO2", "SPO2.3"]

[[studiengaenge]]
key = "IEP"
color = "#9B59B6"   # lila
channel = "fächerwahl-iep"
spos = ["SPO1"]

[[studiengaenge]]
key = "ISB"
color = "#2ECC71"   # grün
channel = "fächerwahl-isb"
spos = ["SPO1", "SPO1.1"]

[[studiengaenge]]
key = "SWB"
color = "#E74C3C"   # rot
channel = "fächerwahl-swb"
spos = ["SPO7", "SPO8"]

[[studiengaenge]]
key = "TIB"
color = "#3498DB"   # blau
channel = "fächerwahl-tib"
spos = ["SPO7", "SPO8"]

[[studiengaenge]]
key = "WKB"
color = "#F1C40F"   # gelb
channel = "fächerwahl-wkb"
spos = ["SPO5", "SPO6"]

# Eigene Angabe, Mehrfachauswahl möglich, schaltet keine Kanäle frei.
