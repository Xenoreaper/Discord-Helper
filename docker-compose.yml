services:
  bot:
    build:
      context: .
      args:
        UID: ${PUID:-1000}
        GID: ${PGID:-1000}
    image: rolebot:latest
    container_name: rolebot
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./config.json:/app/config.json
      - ./server_layout.toml:/app/server_layout.toml:ro
    init: true
    stop_grace_period: 10s
