services:
  bot:
    build:
      context: .
      args:
        UID: ${PUID:-1000}
        GID: ${PGID:-1000}
    image: rolebot:latest
    container_name: rolebot
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${WEB_PORT:-8080}:${WEB_PORT:-8080}"
    volumes:
      - ./config.json:/app/config.json
    init: true
    stop_grace_period: 10s
